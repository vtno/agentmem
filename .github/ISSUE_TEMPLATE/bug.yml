name: Bug report
description: Something is broken or unexpected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce.
        This repo is for docs, issues, and releases — source is private.
  - type: input
    id: version
    attributes:
      label: memory version
      description: Output of `memory --help` first line or release tag (e.g. v0.1.0)
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Agent harness
      options:
        - Claude Code
        - OpenCode
        - CLI only
        - Other / none
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran and what you expected
      placeholder: |
        1. memory list
        2. …
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error output if any
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Install method, AGENTMEM_DIR, relevant config
    validations:
      required: false
